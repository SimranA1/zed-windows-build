name: Open macOS Remote Desktop (VNC)
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
    - name: Download ngrok (macOS)
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip
        else
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip
        fi
        unzip -o ngrok.zip
        chmod +x ngrok

    - name: Auth ngrok
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Screen Sharing (VNC)
      run: |
        # Activate and configure Remote Management for runner user
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -privs -all -users runner
        
        # Enable legacy VNC password authentication
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -clientopts -setvnclegacy -vnclegacy yes \
          -setvncpw -vncpw "P@ssw0rd!"
        
        # Restart the ARD agent to apply settings
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -restart -agent -console
        
        # Ensure Screen Sharing service is loaded
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
        
        echo "Screen Sharing enabled on port 5900"

    - name: Debug VNC Service
      run: |
        echo "=== Port 5900 status ==="
        sudo lsof -i :5900 || echo "Not listening"
        echo "=== Screen Sharing service ==="
        sudo launchctl list | grep -i screen || true
        echo "=== Remote Management config ==="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -query 2>/dev/null || true

    - name: Create VNC Tunnel
      run: |
        ./ngrok tcp 5900 &
        sleep 15
        echo "========================================"
        echo "VNC tunnel is now available!"
        echo "Check ngrok dashboard:"
        echo "https://dashboard.ngrok.com/endpoints/status"
        echo ""
        echo "Connect with VNC client:"
        echo "  Password: P@ssw0rd!"
        echo "========================================"
        
        # Keep alive
        while true; do
          sleep 300
          echo "Session active... $(date '+%Y-%m-%d %H:%M:%S')"
        done

    - name: Cleanup
      if: always()
      run: |
        pkill -f ngrok || true
        echo "Tunnel closed."
