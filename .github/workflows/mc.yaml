name: Open macOS Remote Desktop (VNC)
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
    - name: Download ngrok (macOS)
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip
        else
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip
        fi
        unzip -o ngrok.zip
        chmod +x ngrok

    - name: Auth ngrok
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Screen Sharing (VNC)
      run: |
        # 1. Activate Remote Management for runner user
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -privs -all -users runner
        
        # 2. Set legacy VNC password
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -clientopts -setvnclegacy -vnclegacy yes \
          -setvncpw -vncpw "P@ssw0rd!"
        
        # 3. Restart agent WITH -console (critical for headless runners)
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -restart -agent -console
        
        # 4. Ensure Screen Sharing launchd service is loaded
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
        
        sleep 5

    - name: Verify VNC is listening
      run: |
        echo "=== Port 5900 ==="
        sudo lsof -i :5900 || echo "NOT LISTENING"
        echo "=== ARDAgent process ==="
        ps aux | grep -i "ardagent" | grep -v grep || echo "ARD Agent not running"
        echo "=== Screen Sharing service ==="
        sudo launchctl list | grep -i screensharing || true

    - name: Create VNC Tunnel
      run: |
        ./ngrok tcp 5900 &
        sleep 15
        
        echo "=== ngrok tunnel status ==="
        curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"[^"]*"' || echo "ngrok API unreachable"
        
        echo "========================================"
        echo "VNC tunnel is now available!"
        echo "Dashboard: https://dashboard.ngrok.com/endpoints/status"
        echo "Password:  P@ssw0rd!"
        echo "========================================"
        
        while true; do
          sleep 300
          echo "Session active... $(date '+%Y-%m-%d %H:%M:%S')"
        done

    - name: Cleanup
      if: always()
      run: pkill -f ngrok || true
