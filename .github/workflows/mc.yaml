name: Open macOS Remote Desktop (VNC)
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
    - name: Download ngrok (macOS)
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip
        else
          curl -Lo ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip
        fi
        unzip -o ngrok.zip
        chmod +x ngrok

    - name: Auth ngrok
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Set runner password
      run: |
        # Set a known password for the runner user
        sudo dscl . -passwd /Users/runner "P@ssw0rd!"

    - name: Enable Screen Sharing (VNC)
      run: |
        # Activate Remote Management for runner user
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -privs -all -users runner
        
        # Enable legacy VNC password
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -clientopts -setvnclegacy -vnclegacy yes \
          -setvncpw -vncpw "P@ssw0rd!"
        
        # Restart agent WITHOUT -console (runner is already logged into GUI)
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -restart -agent
        
        # Load Screen Sharing service
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

    - name: Create VNC Tunnel
      run: |
        ./ngrok tcp 5900 &
        sleep 15
        echo "========================================"
        echo "VNC tunnel is now available!"
        echo "Dashboard: https://dashboard.ngrok.com/endpoints/status"
        echo ""
        echo "Try connecting with:"
        echo "  Legacy VNC password: P@ssw0rd!"
        echo "  OR macOS user auth:"
        echo "    Username: runner"
        echo "    Password: P@ssw0rd!"
        echo "========================================"
        while true; do
          sleep 300
          echo "Session active... $(date '+%Y-%m-%d %H:%M:%S')"
        done

    - name: Cleanup
      if: always()
      run: pkill -f ngrok || true
